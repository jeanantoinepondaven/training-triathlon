      sets: 3
      reps: '15'
      notes: block B
    - name: Single-leg glute bridge
      sets: 3
      reps: 12/leg
      notes: block B
  - day: sat
    sport: bike
    title: 'Brick: bike'
    duration: 1h00
    target: Z2 · 65–75% FTP
    description: 'Eat 60 g carbs/h. Go straight into the run: transition under 2 min.'
