# Season 2026-27 · block 4 of 11 · Base 2 (base, 4 weeks)
# Generated by scripts/season/generate.py — edit the generator, not this file.
name: 04 · Base 2
start: '2027-02-01'
goal: Aerobic volume, hills and fartlek, power and plyo
weeks:
- week: 1
  focus: Load · winter
  sessions:
  - day: mon
    sport: run
    title: Noon jog
    duration: 30min
    target: easy · 4:32–5:02/km
  - day: mon
    sport: swim
    title: Swim technique
    description: 'Long, relaxed strokes. Drills: catch-up, fists, 6-kick switch.'
    steps:
    - label: Warm-up
      distance: 400m
      target: easy, mixed strokes
    - label: Drills
      repeat: 8
      distance: 50m
      target: catch-up / fists, 15s rest
    - label: Main
      repeat: 7
      distance: 200m
      target: CSS +6s/100m, 20s rest
    - label: Cool-down
      distance: 200m
  - day: tue
    sport: run
    title: 'Run: easy + uphill sprints'
    steps:
    - label: Easy
      duration: 20min
      target: easy · 4:32–5:02/km
    - label: Uphill sprints
      repeat: 8
      duration: 10s
      target: steep hill, ~90%, walk down (uphill is kind to the knee)
    - label: Easy
      duration: 10min
    description: 'Knee rule: pain at most 2/10 while running and no worse the next morning → keep progressing. More than that
      → repeat last week''s runs. Flat, soft ground, no long downhills, short quick steps.'
  - day: tue
    sport: gym
    title: 'Gym A: max strength'
    description: 'Circuit A: 4 rounds of 4 exercises back to back, 3–4 min rest between rounds. Then block B: 3 sets.'
    exercises:
    - name: Back squat
      sets: 4
      reps: '5'
      load: 80–85% 1RM
      rest: 3–4min
      notes: circuit A
    - name: Romanian deadlift
      sets: 4
      reps: '6'
      load: RPE 8
      notes: circuit A
    - name: Weighted pull-up
      sets: 4
      reps: '5'
      load: RPE 8
      notes: circuit A
    - name: Pallof press
      sets: 4
      reps: 10/side
      notes: circuit A
    - name: Bulgarian split squat
      sets: 3
      reps: 6/leg
      load: RPE 8
      rest: 90s
      notes: block B
    - name: Single-leg calf raise
      sets: 3
      reps: 12/leg
      load: +20 kg
      notes: block B · soleus/Achilles for running
    - name: Copenhagen plank
      sets: 3
      reps: 20s/side
      notes: block B
  - day: wed
    sport: run
    title: Football at noon (counts as run)
    duration: 1h00
    distance: 6.5km
    target: 'intermittent: sprints, changes of direction'
    description: Your run intensity of the week in winter. Warm up properly (ankles, knees). Knee sore afterwards → next day's
      run becomes a walk or bike.
  - day: wed
    sport: gym
    title: 'Gym B: upper body + core'
    description: 'After football at noon: legs stay out of it. Circuit A: 4 rounds, 2 min rest. Block B: 3 sets. Swim shoulders:
      face pulls and rows balance the pressing.'
    exercises:
    - name: Bench press
      sets: 4
      reps: '6'
      load: RPE 8
      rest: 2min
      notes: circuit A
    - name: Chest-supported row
      sets: 4
      reps: '8'
      load: RPE 8
      notes: circuit A
    - name: Half-kneeling landmine press
      sets: 4
      reps: 6/side
      load: RPE 7
      notes: circuit A
    - name: Face pull
      sets: 4
      reps: '15'
      load: light
      notes: circuit A
    - name: Hanging knee raise
      sets: 3
      reps: '10'
      rest: 60s
      notes: block B
    - name: Copenhagen plank
      sets: 3
      reps: 20s/side
      notes: block B
    - name: Dead bug
      sets: 3
      reps: 10/side
      notes: block B
  - day: thu
    sport: other
    title: Bootcamp (work)
    duration: 45min
    description: 'Counts as conditioning. Knee first: swap jumps for step-ups or bike sprints if it complains.'
  - day: thu
    sport: swim
    title: 'Swim: CSS threshold'
    description: CSS = critical swim speed from your 400/200 test.
    steps:
    - label: Warm-up
      distance: 400m
    - label: Build
      repeat: 4
      distance: 50m
      target: build to fast
    - label: CSS
      repeat: 13
      distance: 100m
      target: CSS pace, 10–15s rest
    - label: Pull
      repeat: 2
      distance: 300m
      target: buoy, steady
    - label: Cool-down
      distance: 200m
  - day: fri
    sport: gym
    title: 'Gym C: power + plyo'
    description: 'Circuit A: 4 rounds, full quality, 2–3 min rest. Stop a set if speed drops. Block B: 3 sets. Single-leg
      box jumps only from February and only if the knee has been pain-free; until then two-leg at 60 cm.'
    exercises:
    - name: Hang power clean
      sets: 4
      reps: '3'
      load: 70–75% 1RM
      rest: 2–3min
      notes: circuit A
    - name: Single-leg box jump
      sets: 4
      reps: 3/leg
      load: 60–80 cm
      notes: circuit A · land on one leg, stick it
    - name: Push press
      sets: 4
      reps: '4'
      load: RPE 7
      notes: circuit A
    - name: Nordic hamstring curl
      sets: 4
      reps: '4'
      notes: circuit A · slow lowering
    - name: Step-up
      sets: 3
      reps: 8/leg
      load: RPE 7
      rest: 60s
      notes: block B
    - name: Tibialis raise
      sets: 3
      reps: '15'
      notes: block B
    - name: Dead bug
      sets: 3
      reps: 10/side
      notes: block B
  - day: fri
    sport: bike
    title: Indoor spin
    duration: 35min
    target: Z2 · 65–75% FTP · cadence 85–95
    description: 'Indoor, right after the gym or at home later: Z2, high cadence. Keeps the bike legs through winter.'
  - day: sat
    sport: bike
    title: 'Brick: indoor bike'
    duration: 1h20
    target: Z2 · 65–75% FTP with 3 × 8 min @ 80–88% FTP
    description: 'Indoor trainer in winter (Zwift or ERG). Eat 60 g carbs/h. Go straight into the run: transition under 2
      min. Snowboarding on Saturday? Do this on Sunday instead and drop the Sunday long run.'
  - day: sat
    sport: run
    title: 'Brick: run off the bike'
    duration: 15min
    target: easy · 4:32–5:02/km, quick cadence
  - day: sun
    sport: run
    title: Long run
    duration: 55min
    target: Z2 · 4:32–5:02/km
  - day: sun
    sport: swim
    title: Swim endurance
    distance: 2200m
    target: steady CSS +4–6s/100m, bilateral breathing, sight every 6 strokes
    description: Optional if the week has been heavy. Open water when possible from May.
