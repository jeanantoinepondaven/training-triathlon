<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Strong diagonal: slate top-left → navy → near-black bottom-right. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b536e"/>
      <stop offset="0.35" stop-color="#232a42"/>
      <stop offset="0.7" stop-color="#11141f"/>
      <stop offset="1" stop-color="#040508"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- Two lanes: blue (you) and pink alongside (your partner). -->
  <g filter="url(#shadow)">
    <path d="M 395 686 L 395 655 A 143 143 0 0 1 538 512 L 799 512" fill="none" stroke="#e15cef" stroke-width="134" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 225 686 L 225 635 A 287 287 0 0 1 512 348 L 799 348" fill="none" stroke="#4b8dff" stroke-width="134" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
