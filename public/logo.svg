<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Lilac: near-white at the top, soft lavender at the bottom. -->
    <linearGradient id="bg" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f8f1fd"/>
      <stop offset="0.5" stop-color="#ebdef9"/>
      <stop offset="1" stop-color="#d9c6f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5b3a8a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- Two lanes: navy (you) and fuchsia alongside (your partner). -->
  <g filter="url(#shadow)">
    <path d="M 225 686 L 225 635 A 287 287 0 0 1 512 348 L 799 348" fill="none" stroke="#15306f" stroke-width="134" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 395 686 L 395 655 A 143 143 0 0 1 538 512 L 799 512" fill="none" stroke="#cc2fe0" stroke-width="134" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
